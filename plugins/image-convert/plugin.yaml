id: image-convert
name: Image Converter / Resizer
category: Images
icon: "🖼"
description: Convert (HEIC→JPG, PNG→WebP, …), resize and compress images in bulk, stripping EXIF/location data. Powered by libvips.
run: [python3, run.py]
submit_label: Convert
timeout: 1h
inputs:
  - {name: files, label: Images, type: file, accept: "image/*,.heic,.heif,.avif,.jxl,.tif,.tiff", multiple: true, required: true}
  - name: format
    label: Output format
    type: select
    default: jpg
    options:
      - {value: jpg, label: JPG}
      - {value: webp, label: WebP}
      - {value: png, label: PNG}
      - {value: avif, label: "AVIF (smallest, slower)"}
      - {value: keep, label: Keep original format (HEIC → JPG)}
  - {name: quality, label: Quality, type: number, default: 82, min: 1, max: 100, help: "80–85 is a good balance. Ignored for PNG."}
  - name: resize
    label: Resize
    type: select
    default: none
    options: [{value: none, label: No resizing}, {value: long, label: Longest side (px)}, {value: width, label: Width (px)}, {value: percent, label: Percent}]
  - {name: size, label: Pixels, type: number, default: 2048, min: 16, max: 20000, show_if: {resize: [long, width]}}
  - {name: percent, label: Percent, type: number, default: 50, min: 1, max: 100, show_if: {resize: [percent]}}
  - {name: strip, label: Strip metadata (EXIF, GPS location, camera info), type: checkbox, default: true}
  - {name: zip, label: Bundle into a .zip when there are several images, type: checkbox, default: true}
