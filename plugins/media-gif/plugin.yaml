id: media-gif
name: Video → GIF / WebP
category: Media
icon: "🌀"
description: Turn a video clip into a good-looking animated GIF (palette-optimised) or animated WebP.
run: [python3, run.py]
submit_label: Create
timeout: 1h
inputs:
  - {name: files, label: Video file, type: file, accept: "video/*,audio/*,.mkv,.flac,.opus,.m4a,.ts,.avi,.wmv,.mov", required: true}
  - name: format
    label: Format
    type: select
    default: gif
    options: [{value: gif, label: GIF}, {value: webp, label: "Animated WebP (smaller, better colours)"}]
  - {name: start, label: Start, placeholder: "0 or 00:00:05", default: "0"}
  - {name: duration, label: Duration (seconds), type: number, default: 5, min: 0.1, max: 120}
  - {name: fps, label: Frames per second, type: number, default: 12, min: 1, max: 50}
  - {name: width, label: Width (px), type: number, default: 480, min: 16, max: 1920, help: Height follows the aspect ratio.}
  - {name: loop, label: Loop forever, type: checkbox, default: true}
